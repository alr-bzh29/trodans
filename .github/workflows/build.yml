name: Compilation Android

on:
  push:
    branches-ignore: [ci-logs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android (fichiers non versionnés)
        run: |
          flutter --version
          flutter create --platforms=android --org bzh.alr --project-name trodans .
          rm -rf test   # test d'exemple généré, inutile ici
          python3 tool/patch_android.py

      - name: Dépendances
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          flutter pub get 2>&1 | tee "$RUNNER_TEMP/ci-logs/pub.txt"
          flutter pub deps --style=compact > "$RUNNER_TEMP/ci-logs/deps.txt" 2>&1 || true
          flutter --version > "$RUNNER_TEMP/ci-logs/flutter-version.txt" 2>&1

      - name: Analyse du code
        shell: bash
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee "$RUNNER_TEMP/ci-logs/analyze.txt"

      - name: Compilation de l'APK
        shell: bash
        run: |
          VERSION="0.1.${{ github.run_number }}"
          BUILD_DATE="$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=BUILD_DATE="$BUILD_DATE" 2>&1 | tee "$RUNNER_TEMP/ci-logs/build.txt"

      - name: Signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Le secret KEYSTORE_PASSWORD n'est pas défini dans le dépôt."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android-signing/trodans.jks.enc -out "$RUNNER_TEMP/trodans.jks" \
            -pass env:KEYSTORE_PASSWORD
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          OUT="TroDans-$VERSION.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/trodans.jks" --ks-key-alias trodans \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$OUT" build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/trodans.jks"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      # Seule la branche main publie une version (visible dans Obtainium).
      - name: Publication (release GitHub pour Obtainium)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TroDañs ${{ env.VERSION }}
          body: Version de test compilée automatiquement depuis ${{ github.sha }}.
          prerelease: true
          files: ${{ env.APK }}

      # Journaux recopiés dans la branche « ci-logs » pour pouvoir les lire
      # sans accès aux journaux GitHub Actions.
      - name: Journaux
        if: always()
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ci-logs"
          echo "run ${{ github.run_number }} ${{ github.sha }} ${{ job.status }}" > "$RUNNER_TEMP/ci-logs/run.txt"
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -q --orphan ci-logs-tmp
          git rm -rfq . > /dev/null
          rm -rf ./* 2>/dev/null || true
          cp "$RUNNER_TEMP"/ci-logs/* .
          git add -A
          git commit -qm "Journaux du run ${{ github.run_number }}"
          git push -qf origin HEAD:ci-logs
