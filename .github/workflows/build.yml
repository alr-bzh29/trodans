name: Compilation Android

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Générer le projet Android (fichiers non versionnés)
        run: |
          flutter --version
          flutter create --platforms=android --org bzh.alr --project-name trodans .
          python3 tool/patch_android.py

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Compilation de l'APK
        run: |
          VERSION="0.1.${{ github.run_number }}"
          BUILD_DATE="$(TZ=Europe/Paris date '+%d/%m/%Y %H:%M')"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          flutter build apk --release \
            --build-name="$VERSION" --build-number="${{ github.run_number }}" \
            --dart-define=APP_VERSION="$VERSION" \
            --dart-define=BUILD_DATE="$BUILD_DATE"

      - name: Signature
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Le secret KEYSTORE_PASSWORD n'est pas défini dans le dépôt."
            exit 1
          fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in android-signing/trodans.jks.enc -out "$RUNNER_TEMP/trodans.jks" \
            -pass env:KEYSTORE_PASSWORD
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          OUT="TroDans-$VERSION.apk"
          "$APKSIGNER" sign --ks "$RUNNER_TEMP/trodans.jks" --ks-key-alias trodans \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEYSTORE_PASSWORD \
            --out "$OUT" build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" verify --print-certs "$OUT" | head -3
          rm -f "$RUNNER_TEMP/trodans.jks"
          echo "APK=$OUT" >> "$GITHUB_ENV"

      - name: Publication (release GitHub pour Obtainium)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: TroDañs ${{ env.VERSION }}
          body: Version de test compilée automatiquement depuis ${{ github.sha }}.
          prerelease: true
          files: ${{ env.APK }}
